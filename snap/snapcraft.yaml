name: term-ai
version: '2.0.1'
summary: Linux terminali için yerel AI asistanı ve Web Terminali
description: |
  term-ai; Ollama, OpenAI, Google Gemini, vLLM ve Azure AI ile çalışan bir
  Linux terminal AI asistanıdır. Yeni nesil Web Arayüzü ile tarayıcınızdan
  hem Linux terminalinizi yönetebilir hem de yapay zeka ile anında sohbet
  edebilirsiniz. PTY destekli canlı terminal ile yazdığınız komutların
  hata çıktılarını tek tıkla yapay zekaya gönderebilirsiniz.

  Desteklenen sağlayıcılar: ollama, openai, gemini, vllm, azure

  Kullanım:
    term-ai

grade: stable
confinement: strict
base: core22

# Desteklenen mimariler
architectures:
  - build-on: [amd64]
    build-for: [amd64]
  - build-on: [arm64]
    build-for: [arm64]

parts:
  term-ai:
    plugin: go
    source: .
    source-type: local
    build-snaps:
      - go/1.22/stable
    # Derleme sırasında binary'yi doğru konuma koy
    override-build: |
      go build -ldflags="-s -w" -o "$SNAPCRAFT_PART_INSTALL/bin/term-ai" .
    # Sadece binary'yi pakete al, kaynak dosyaları alma
    stage:
      - bin/term-ai

apps:
  term-ai:
    command: bin/term-ai
    plugs:
      - network
      - network-bind
      - home
