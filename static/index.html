<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Term_Ai</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- xterm.js for the terminal -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.1.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.1.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.7.0/lib/xterm-addon-fit.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <i class="fas fa-brain"></i> Term_Ai
            </div>
            <div class="nav-item active"><i class="fas fa-comment-dots"></i> AI Sohbet</div>
            <div class="nav-item" onclick="alert('Henüz yapım aşamasında')"><i class="fas fa-history"></i> Geçmiş</div>
            <div class="nav-item" id="open-settings-btn"><i class="fas fa-cog"></i> Ayarlar</div>
        </div>

        <!-- Main Content (AI Chat) -->
        <div class="chat-container">
            <div class="header">
                <h2><i class="fas fa-robot"></i> Yapay Zeka Asistanı</h2>
                <div class="model-info" id="model-info">Yükleniyor...</div>
            </div>
            
            <div class="messages" id="messages">
                <div class="message ai">
                    Merhaba! Ben Term_Ai. Sağ taraftaki terminali kullanarak Linux sistemini yönetebilir, hata aldığınızda ise çıktıyı seçip bana gönderebilirsiniz. 🚀
                </div>
            </div>

            <div class="input-area">
                <textarea id="ai-input" placeholder="Yapay zekaya bir şey sorun (Enter ile gönder)..."></textarea>
                <button id="send-ai-btn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>

        <!-- Right Panel (Embedded Terminal) -->
        <div class="terminal-panel">
            <div class="terminal-header">
                <h3><i class="fas fa-laptop-code"></i> Canlı Terminal</h3>
                <button id="send-to-ai-btn" title="Terminladen metin seçip bu butona basın"><i class="fas fa-share"></i> Seçili Çıktıyı Çöz</button>
            </div>
            <div id="terminal-container"></div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-cog"></i> Ayarlar</h2>
                <button id="close-settings-btn" class="icon-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Yapay Zeka Sağlayıcısı (Provider)</label>
                    <select id="settings-provider">
                        <option value="ollama">Ollama (Yerel)</option>
                        <option value="openai">OpenAI</option>
                        <option value="gemini">Google Gemini</option>
                        <option value="vllm">vLLM</option>
                        <option value="azure">Azure AI</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Model Adı</label>
                    <input type="text" id="settings-model" list="ollama-models" placeholder="Örn: gemma2:2b veya gpt-4o">
                    <datalist id="ollama-models"></datalist>
                    <small>Boş bırakırsanız Ollama için ilk model otomatik seçilir.</small>
                </div>
                <!-- API Keys (Gizli / Görünür) -->
                <div class="form-group api-key-group" id="group-openai" style="display:none;">
                    <label>OpenAI API Key</label>
                    <input type="password" id="settings-openai-key" placeholder="sk-...">
                </div>
                <div class="form-group api-key-group" id="group-gemini" style="display:none;">
                    <label>Gemini API Key</label>
                    <input type="password" id="settings-gemini-key" placeholder="AIza...">
                </div>
                <div class="form-group api-key-group" id="group-azure" style="display:none;">
                    <label>Azure Endpoint</label>
                    <input type="text" id="settings-azure-endpoint" placeholder="https://...">
                    <label style="margin-top:5px;">Azure API Key</label>
                    <input type="password" id="settings-azure-key" placeholder="...">
                </div>
                <button id="save-settings-btn" class="primary-btn">Kaydet ve Uygula</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
